# Servicio del backend en Render. Documenta la configuración que hoy está en el panel de Render.
# No crear un Blueprint nuevo con este archivo esta semana: Render crearía un segundo servicio.
services:
  - type: web
    name: plataforma5e-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install .
    # El sábado: uvicorn platform5e.main:create_app --factory --host 0.0.0.0 --port $PORT
    startCommand: uvicorn plataforma5e.bootstrap.app:crear_aplicacion --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud   # el sábado: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false           # se escribe en el panel de Render, nunca en Git
      - key: CORS_ORIGENES
        value: https://plataforma-5e-taller-integrador.vercel.app
      - key: IA_PROVEEDOR
        value: gemini
      - key: IA_API_KEY
        sync: false
      - key: BUSQUEDA_POR_TEMA
        value: "true"
