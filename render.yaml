# Servicio del backend en Render. Documenta la configuración que hoy está en el panel de Render.
# No crear un Blueprint nuevo con este archivo esta semana: Render crearía un segundo servicio.
services:
  - type: web
    name: plataforma5e-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn platform5e.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false           # se escribe en el panel de Render, nunca en Git
      # Nombres en inglés. El backend todavía lee los anteriores (CORS_ORIGENES, IA_PROVEEDOR, IA_API_KEY,
      # BUSQUEDA_POR_TEMA…) para que el servicio no se caiga mientras se renombran en el panel.
      - key: CORS_ALLOWED_ORIGINS
        value: https://plataforma-5e-taller-integrador.vercel.app
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: TOPIC_SEARCH_ENABLED
        value: "true"
