# Frontend (React + TypeScript): tipos, pruebas unitarias con cobertura y build. No necesita el backend.
name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:          # en los PR corre siempre: así el check requerido de la regla de main siempre aparece
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage (TA-008)
        run: npm run test:coverage
      - name: Coverage summary
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (n, k) => `| ${n} | ${t[k].pct} % | ${t[k].covered} / ${t[k].total} |`;
            console.log(["### Frontend coverage", "", "| Metric | Coverage | Covered |", "|---|---|---|",
              row("Lines", "lines"), row("Statements", "statements"), row("Functions", "functions"), row("Branches", "branches")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14
          if-no-files-found: ignore
      - name: Build
        run: npm run build
