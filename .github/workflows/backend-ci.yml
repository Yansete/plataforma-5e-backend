# Backend (FastAPI): pruebas unitarias, de arquitectura, de integración y de punta a punta. No necesita el frontend.
name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform5e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev,postgres]" pytest-cov
      - name: Unit, architecture and integration tests with coverage (TA-008)
        run: >-
          python -m pytest tests/unit tests/architecture tests/integration -q
          --cov=platform5e.domain --cov=platform5e.application
          --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=80
          --junitxml=reports/unit.xml
      - name: Coverage summary
        if: always() && hashFiles('backend/.coverage') != ''
        run: |
          echo "### Backend coverage (domain and application)" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: End-to-end over HTTP with SQLite
        run: python -m pytest tests/e2e --junitxml=reports/e2e-sqlite.xml
      - name: End-to-end over HTTP with PostgreSQL
        env:
          E2E_DATABASE_URL: postgresql+psycopg://platform:platform@localhost:5432/platform5e
        run: python -m pytest tests/e2e --junitxml=reports/e2e-postgres.xml
      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/reports
          retention-days: 14
