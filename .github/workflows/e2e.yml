name: End-to-end

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Yansete/plataforma-5e-frontend
          ref: main
          path: .frontend-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .frontend-source/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: python -m pip install -e ./backend

      - name: Record frontend version
        run: git -C .frontend-source rev-parse HEAD

      - name: Install frontend
        working-directory: .frontend-source
        run: npm ci

      - name: Install Chromium
        working-directory: .frontend-source
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: .frontend-source
        run: npm run test:e2e
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend
          PYTHON: python

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            .frontend-source/playwright-report/
            .frontend-source/test-results/
          if-no-files-found: ignore
          retention-days: 7
